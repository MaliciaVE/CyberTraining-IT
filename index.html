<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06111d"><title>Cyber Training Lab</title><style>
:root{--bg:#06111d;--bg2:#0d2131;--panel:#0a1826e8;--text:#eefbff;--muted:#8aa6b7;--line:#29485b;--accent:#35e6c0;--orange:#ffb547;--danger:#ff6177}html[data-theme=light]{--bg:#dce8ee;--bg2:#f8fbfc;--panel:#f9fcffed;--text:#102536;--muted:#587384;--line:#adbfca;--accent:#007f72;--orange:#a85d00;--danger:#c5324c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}body{min-height:100vh;background:radial-gradient(circle at 15% 8%,color-mix(in srgb,var(--accent),transparent 84%),transparent 34%),radial-gradient(circle at 90% 85%,color-mix(in srgb,var(--orange),transparent 91%),transparent 32%),linear-gradient(145deg,var(--bg),var(--bg2))}.screen{min-height:100vh;display:grid;place-items:center;padding:28px}.hidden{display:none!important}.theme{position:fixed;z-index:20;right:18px;top:18px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 12px;border-radius:7px;cursor:pointer;font:700 10px ui-monospace,Consolas,monospace}.card{width:min(570px,94vw);border:1px solid var(--line);background:var(--panel);padding:clamp(28px,5vw,54px);box-shadow:0 30px 90px #0007;backdrop-filter:blur(16px)}.kicker{font:800 10px ui-monospace,Consolas,monospace;letter-spacing:.18em;color:var(--accent)}h1{font-size:clamp(40px,7vw,72px);line-height:.93;letter-spacing:-.055em;margin:15px 0}p{color:var(--muted);line-height:1.6}.pwrow{display:flex;gap:8px;margin-top:25px}.pwrow input{flex:1;min-width:0;border:1px solid var(--line);background:color-mix(in srgb,var(--bg),transparent 22%);color:var(--text);padding:13px;font:700 13px ui-monospace,Consolas,monospace;outline:0}.pwrow input:focus{border-color:var(--accent)}.enter{border:0;background:var(--accent);color:var(--bg);font-weight:900;padding:0 20px;cursor:pointer}.error{min-height:20px;margin-top:8px;color:var(--danger);font:11px ui-monospace,Consolas,monospace}.selector{width:min(1080px,95vw)}.selector h1{font-size:clamp(38px,6vw,68px)}.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:30px}.game{position:relative;min-height:330px;padding:30px;border:1px solid var(--line);background:var(--panel);color:var(--text);text-align:left;cursor:pointer;overflow:hidden;transition:.2s}.game:hover,.game:focus-visible{transform:translateY(-6px);border-color:var(--accent);outline:0}.game .label{color:var(--accent);font:800 10px ui-monospace,Consolas,monospace;letter-spacing:.15em}.game:nth-child(2) .label,.game:nth-child(2) .launch{color:var(--orange)}.game h2{font-size:clamp(28px,4vw,46px);margin:28px 0 10px}.game p{max-width:36ch}.launch{position:absolute;left:30px;bottom:28px;color:var(--accent);font:800 10px ui-monospace,Consolas,monospace;letter-spacing:.1em}.ghost{position:absolute;right:18px;top:5px;font:900 90px ui-monospace,Consolas,monospace;color:color-mix(in srgb,var(--accent),transparent 93%)}.game:nth-child(2) .ghost{color:color-mix(in srgb,var(--orange),transparent 92%)}@media(max-width:720px){.games{grid-template-columns:1fr}.game{min-height:250px}.pwrow{flex-direction:column}.enter{padding:12px}}
</style></head><body><button id="theme" class="theme">◐ THEME</button><section id="gate" class="screen"><div class="card"><div class="kicker">// RESTRICTED TRAINING ENVIRONMENT</div><h1>Cyber<br>Training Lab</h1><p>Enter the session password to access the cyber training modules.</p><form id="accessForm"><div class="pwrow"><input id="password" type="password" autocomplete="current-password" placeholder="SESSION PASSWORD" aria-label="Session password"><button class="enter" type="submit">ENTER →</button></div><div class="error" id="error"></div></form></div></section><section id="chooser" class="screen hidden"><div class="selector"><div class="kicker">// SELECT TRAINING MODULE</div><h1>Choose your operation.</h1><p>Two formats, one training environment. Choose the experience that fits the session.</p><div class="games"><button class="game" data-url="./secure-sprint/index.html"><span class="ghost">01</span><span class="label">MODULE 01 // DECISION GAME</span><h2>Secure Sprint</h2><p>Decision-based cyber awareness game for IT teams and developers.</p><span class="launch">LAUNCH SECURE SPRINT →</span></button><button class="game" data-url="./hack-the-desk/index.html"><span class="ghost">02</span><span class="label">MODULE 02 // FACILITATED GAME</span><h2>Hack the Desk</h2><p>Explore an unattended workstation, discuss attack opportunities, then reveal the facilitator debrief.</p><span class="launch">LAUNCH HACK THE DESK →</span></button></div></div></section><script src="access-config.js"></script><script>
(()=>{const $=id=>document.getElementById(id),encoder=new TextEncoder();async function sha256(v){const b=await crypto.subtle.digest('SHA-256',encoder.encode(v));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}function unlock(){$('gate').classList.add('hidden');$('chooser').classList.remove('hidden')}if(sessionStorage.getItem('cybertraining-access')==='granted')unlock();$('accessForm').onsubmit=async e=>{e.preventDefault();if(await sha256($('password').value)===window.PORTAL_ACCESS.PASSWORD_SHA256){if(window.PORTAL_ACCESS.REMEMBER_FOR_SESSION)sessionStorage.setItem('cybertraining-access','granted');$('password').value='';$('error').textContent='';unlock()}else{$('error').textContent='ACCESS DENIED // Invalid session password';$('password').select()}};document.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>location.href=b.dataset.url);$('theme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('portal-theme',t)};const saved=localStorage.getItem('portal-theme');if(saved)document.documentElement.dataset.theme=saved})();
</script></body></html>
